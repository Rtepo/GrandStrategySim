[workspace]
members = ["state", "src-tauri"]
resolver = "2"

[workspace.lints.clippy]
# Phase 86.5B: Allow pre-existing lint categories workspace-wide.
# These are structural patterns inherited from earlier phases.
field_reassign_with_default = "allow"
manual_clamp = "allow"
too_many_arguments = "allow"
ptr_arg = "allow"
doc_lazy_continuation = "allow"
if_same_then_else = "allow"
module_inception = "allow"
type_complexity = "allow"
manual_range_contains = "allow"

# ─── Daemon v2 Pillar 3: kill the 2-hour debug-test bottleneck ────────────
# The 120s+ suite ran fully unoptimized (opt-level 0) with full debuginfo,
# which (a) made the 27+ test binaries execute simulation crucibles ~5-10x
# slower than necessary and (b) produced multi-GB PDB/LTO payloads that
# spiked linker RAM and triggered OOM kills mid-suite.
#
# Dependencies: opt-level 1 + line-tables-only debuginfo. Keeps per-crate
# debuggability (line tables preserved for stack traces) while cutting the
# dominant linker RAM cost — dependency debuginfo is the bulk of every test
# binary's debug payload.
[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# Test binaries themselves: opt-level 1 (~5-10x faster sim crucibles) and
# line-tables-only debuginfo. Incremental stays on for fast re-links.
[profile.test]
opt-level = 1
debug = "line-tables-only"
incremental = true
