name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version sync with tag
        shell: bash
        run: |
          # Strip the leading 'v' from the Git tag to get the expected SemVer.
          EXPECTED="${GITHUB_REF_NAME#v}"
          # Read the version from tauri.conf.json (authoritative for the updater).
          ACTUAL=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "Tag version:   ${EXPECTED}"
          echo "Config version: ${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Version mismatch — tauri.conf.json (${ACTUAL}) does not match tag (${EXPECTED}). Bump the internal version before tagging."
            exit 1
          fi
          echo "Version sync OK."

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Grand Strategy Sim ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'
