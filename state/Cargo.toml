[package]
name = "sim_engine"
version = "0.1.0"
edition = "2021"
description = "Rust migration of the Grand Strategy simulation engine (Target 0: static registries & core math)."
license = "MIT"

[lib]
name = "sim_engine"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "0.8", features = ["v4", "serde"] }
getrandom = "0.2"
csv = "1.3"
ts-rs = { version = "12", features = ["serde-compat"] }

[profile.dev]
incremental = true

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
