[package]
name = "sim_engine"
version = "1.1.0"
edition = "2021"
description = "Rust migration of the Grand Strategy simulation engine (Target 0: static registries & core math)."
license = "MIT"

[lints]
workspace = true

[lib]
name = "sim_engine"
path = "src/lib.rs"

[dependencies]
rayon = "1.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "0.8", features = ["v4", "serde"] }
getrandom = "0.2"
csv = "1.3"
ts-rs = { version = "12", features = ["serde-compat"] }
slotmap = { version = "1.0", features = ["serde"] }
rustc-hash = "2.0"

[profile.dev]
incremental = true

[dev-dependencies]
tempfile = "3.10"

[features]
default = []
## Enables the TurnProbe instrumentation in run_turn_in_memory and the
## CapturingProbe / 6-turn diagnostic harness test. When enabled, the
## probed entry point `run_turn_in_memory_probed` is exported.
diagnostic = []

[profile.release]
opt-level = 3
lto = true
