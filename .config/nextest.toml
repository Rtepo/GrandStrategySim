# nextest CI profile — Architecture v4
# Used by integration_daemon.sh and request_integration.sh for parallel
# test execution with OOM-safe thread limits and flaky test retries.
#
# v4: Epic test segregation is handled by Cargo features, not nextest filters.
# Fast CI: cargo nextest run --workspace --all-targets (no --features epic-tests)
# Epic CI: cargo nextest run --workspace --all-targets --features epic-tests,diagnostic
# The [[test]] blocks in state/Cargo.toml with required-features = ["epic-tests"]
# ensure epic test binaries are not compiled during fast CI runs.

[profile.ci]
retries = 2
fail-fast = false
status-level = "fail"
final-status-level = "fail"

# ts-rs `#[ts(export)]` tests read-modify-write the shared
# src/types/api.ts via a per-process EXPORT_PATHS registry: the first
# exporter in a process calls File::create (TRUNCATE), later ones merge.
# Under `cargo test` all tests share one process so writes accumulate, but
# nextest runs each test in its OWN process — every export_bindings test
# truncates api.ts to just its own types, leaving a torn ~700-byte file.
# Serialization (test-groups max-threads=1) cannot fix this: each process
# still sees an empty registry and truncates. The torn file then breaks
# `npm run build` (tsc cannot resolve the missing types) and leaves the
# working tree dirty, which cascades into DIRTY_TREE_TIMEOUT blocks.
#
# Exclude export_bindings tests from the ci profile entirely. Regenerate
# bindings deterministically in a single process with:
#   cargo test -p sim_engine --lib export_bindings -- --test-threads=1
default-filter = 'not test(/export_bindings/)'
